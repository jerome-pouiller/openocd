# Silicon Labs EFM32PG27/EFR32xG27 target

set FLASHBASE 0x08000000
source [find target/silabs/series2.cfg]

# VC_CORERESET does not work on xG27, use hw breakpoint at reset vector
$_TARGETNAME configure -event reset-assert-pre {
	silabs_s2_reset_assert_pre 0x08000000 $halt
}

$_TARGETNAME configure -event reset-deassert-post {
	silabs_s2_reset_deassert_post $halt
}
